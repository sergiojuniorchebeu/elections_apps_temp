name: elections_app
description: "Votaa app (digital ID, elections, petitions) that runs on a built-in simulator and plugs into any back-end."
publish_to: 'none'

version: 0.2.0+2

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0

  # State, navigation
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4

  # Network (reference REST implementation only)
  dio: ^5.11.1

  # Storage
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6

  # Formats, ids
  intl: ^0.20.3
  uuid: ^4.6.0

  # "Show code" sheet (pure Dart, no network)
  qr_flutter: ^4.1.0
  # Default problem report = prefilled e-mail
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Light.ttf
          weight: 300
        - asset: assets/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
